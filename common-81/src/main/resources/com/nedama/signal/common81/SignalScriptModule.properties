# Script hints for system.signal. Keep this file ASCII. Every function needs .desc, .returns and one
# .param entry per parameter; random_check.py checks this against the core signatures.

detrend.desc=Remove a linear or constant trend from a signal. Same as scipy.signal.detrend for 1-D data.
detrend.param.data=The signal, a list of numbers. None, NaN and infinity are not allowed.
detrend.param.axis=-1 (default) or 0. Signals are 1-D, so both mean the same.
detrend.param.type='linear' (default) subtracts a least-squares line; 'constant' subtracts the mean.
detrend.param.bp=Breakpoints for 'linear': sample indices where a new line starts. An integer or a list.
detrend.param.overwrite_data=Accepted for compatibility with scipy. The input is never modified.
detrend.returns=The detrended signal, a list of floats.

get_window.desc=Return a window of Nx points. Same as scipy.signal.get_window. Windows: hann, hamming, blackman, blackmanharris, nuttall, flattop, boxcar, triang, bartlett, parzen, bohman, barthann, cosine, lanczos, tukey, kaiser, kaiser_bessel_derived, gaussian, general_gaussian, general_hamming, general_cosine, exponential, taylor, chebwin.
get_window.param.window=A name such as 'hann', a tuple with parameters such as ('kaiser', 8.6) or ('tukey', 0.25), or a number (a Kaiser beta). A name ending in _symmetric or _periodic overrides fftbins.
get_window.param.Nx=Number of points, a positive integer.
get_window.param.fftbins=True (default): periodic window, for spectral analysis. False: symmetric window, for filter design.
get_window.returns=The window, a list of floats.

butter.desc=Design a Butterworth filter (maximally flat passband). Same as scipy.signal.butter.
butter.param.N=Filter order, a whole number.
butter.param.Wn=Critical frequency: a number for low-pass and high-pass, [low, high] for band-pass and band-stop. Normalised to 0..1 (1 = Nyquist) unless fs is given, then in the same units as fs.
butter.param.btype='lowpass' (default), 'highpass', 'bandpass' or 'bandstop'.
butter.param.analog=True for an analog filter (Wn in rad/s). Default False.
butter.param.output='ba' (default), 'zpk' or 'sos'. Use 'sos' for filtering: it stays accurate at high orders.
butter.param.fs=Sampling frequency of the system, in the units of Wn. Default None (Wn normalised).
butter.returns=(b, a), (z, p, k) or a list of sos rows, depending on output. z and p hold complex numbers.

cheby1.desc=Design a Chebyshev type I filter (ripple in the passband). Same as scipy.signal.cheby1.
cheby1.param.N=Filter order, a whole number.
cheby1.param.rp=Passband ripple in dB (positive).
cheby1.param.Wn=Critical frequency: a number for low-pass and high-pass, [low, high] for band-pass and band-stop. Normalised to 0..1 (1 = Nyquist) unless fs is given, then in the same units as fs.
cheby1.param.btype='lowpass' (default), 'highpass', 'bandpass' or 'bandstop'.
cheby1.param.analog=True for an analog filter (Wn in rad/s). Default False.
cheby1.param.output='ba' (default), 'zpk' or 'sos'. Use 'sos' for filtering: it stays accurate at high orders.
cheby1.param.fs=Sampling frequency of the system, in the units of Wn. Default None (Wn normalised).
cheby1.returns=(b, a), (z, p, k) or a list of sos rows, depending on output. z and p hold complex numbers.

cheby2.desc=Design a Chebyshev type II filter (ripple in the stopband). Same as scipy.signal.cheby2.
cheby2.param.N=Filter order, a whole number.
cheby2.param.rs=Minimum stopband attenuation in dB (positive).
cheby2.param.Wn=Frequency where the attenuation first reaches rs: a number, or [low, high] for band filters. Normalised to 0..1 unless fs is given.
cheby2.param.btype='lowpass' (default), 'highpass', 'bandpass' or 'bandstop'.
cheby2.param.analog=True for an analog filter (Wn in rad/s). Default False.
cheby2.param.output='ba' (default), 'zpk' or 'sos'. Use 'sos' for filtering: it stays accurate at high orders.
cheby2.param.fs=Sampling frequency of the system, in the units of Wn. Default None (Wn normalised).
cheby2.returns=(b, a), (z, p, k) or a list of sos rows, depending on output. z and p hold complex numbers.

ellip.desc=Design an elliptic (Cauer) filter, the sharpest transition for its order. Same as scipy.signal.ellip.
ellip.param.N=Filter order, a whole number.
ellip.param.rp=Passband ripple in dB (positive).
ellip.param.rs=Minimum stopband attenuation in dB (positive).
ellip.param.Wn=Critical frequency: a number for low-pass and high-pass, [low, high] for band-pass and band-stop. Normalised to 0..1 (1 = Nyquist) unless fs is given, then in the same units as fs.
ellip.param.btype='lowpass' (default), 'highpass', 'bandpass' or 'bandstop'.
ellip.param.analog=True for an analog filter (Wn in rad/s). Default False.
ellip.param.output='ba' (default), 'zpk' or 'sos'. Use 'sos' for filtering: it stays accurate at high orders.
ellip.param.fs=Sampling frequency of the system, in the units of Wn. Default None (Wn normalised).
ellip.returns=(b, a), (z, p, k) or a list of sos rows, depending on output. z and p hold complex numbers.

bessel.desc=Design a Bessel filter (flattest group delay, so the least overshoot). Same as scipy.signal.bessel.
bessel.param.N=Filter order, a whole number.
bessel.param.Wn=Critical frequency: a number for low-pass and high-pass, [low, high] for band-pass and band-stop. Normalised to 0..1 (1 = Nyquist) unless fs is given, then in the same units as fs.
bessel.param.btype='lowpass' (default), 'highpass', 'bandpass' or 'bandstop'.
bessel.param.analog=True for an analog filter (Wn in rad/s). Default False.
bessel.param.output='ba' (default), 'zpk' or 'sos'. Use 'sos' for filtering: it stays accurate at high orders.
bessel.param.norm='phase' (default), 'delay' or 'mag': what Wn means.
bessel.param.fs=Sampling frequency of the system, in the units of Wn. Default None (Wn normalised).
bessel.returns=(b, a), (z, p, k) or a list of sos rows, depending on output. z and p hold complex numbers.

freqz.desc=Frequency response of a digital filter. Same as scipy.signal.freqz.
freqz.param.b=Numerator coefficients.
freqz.param.a=Denominator coefficients. Default 1.
freqz.param.worN=Number of frequencies (default 512), or the frequencies to evaluate, in the units of fs.
freqz.param.whole=True to cover 0 to fs instead of 0 to fs/2. Default False.
freqz.param.plot=Not supported: must be None. Plot w and h from the result.
freqz.param.fs=Sampling frequency, in the units w is returned in. Default 2*pi (rad/sample).
freqz.param.include_nyquist=True to include fs/2 as the last frequency when worN is a count. Default False.
freqz.returns=(w, h): frequencies (floats) and the complex response at each.

freqz_sos.desc=Frequency response of a filter in second-order sections. Same as scipy.signal.freqz_sos.
freqz_sos.param.sos=Second-order sections, rows of [b0, b1, b2, 1, a1, a2].
freqz_sos.param.worN=Number of frequencies (default 512), or the frequencies to evaluate, in the units of fs.
freqz_sos.param.whole=True to cover 0 to fs instead of 0 to fs/2. Default False.
freqz_sos.param.fs=Sampling frequency, in the units w is returned in. Default 2*pi (rad/sample).
freqz_sos.returns=(w, h): frequencies (floats) and the complex response at each.

sosfreqz.desc=Frequency response of a filter in second-order sections. Older name of freqz_sos, kept for compatibility.
sosfreqz.param.sos=Second-order sections, rows of [b0, b1, b2, 1, a1, a2].
sosfreqz.param.worN=Number of frequencies (default 512), or the frequencies to evaluate, in the units of fs.
sosfreqz.param.whole=True to cover 0 to fs instead of 0 to fs/2. Default False.
sosfreqz.param.fs=Sampling frequency, in the units w is returned in. Default 2*pi (rad/sample).
sosfreqz.returns=(w, h): frequencies (floats) and the complex response at each.

buttord.desc=Lowest Butterworth order that meets a specification, and its natural frequency. Same as scipy.signal.buttord.
buttord.param.wp=Passband edge: a number for low-pass and high-pass, [low, high] for band filters. Normalised to 0..1 (1 = Nyquist) unless fs is given, then in the units of fs.
buttord.param.ws=Stopband edge, in the same form and units as wp.
buttord.param.gpass=Maximum loss in the passband, in dB.
buttord.param.gstop=Minimum attenuation in the stopband, in dB.
buttord.param.analog=True for an analog filter (frequencies in rad/s). Default False.
buttord.param.fs=Sampling frequency, in the units of wp and ws. Default None (normalised).
buttord.returns=(N, Wn): the order (an int) and the natural frequency (a number, or [low, high]), ready for butter(N, ..., Wn).

cheb1ord.desc=Lowest Chebyshev type I order that meets a specification, and its natural frequency. Same as scipy.signal.cheb1ord.
cheb1ord.param.wp=Passband edge: a number for low-pass and high-pass, [low, high] for band filters. Normalised to 0..1 (1 = Nyquist) unless fs is given, then in the units of fs.
cheb1ord.param.ws=Stopband edge, in the same form and units as wp.
cheb1ord.param.gpass=Maximum loss in the passband, in dB.
cheb1ord.param.gstop=Minimum attenuation in the stopband, in dB.
cheb1ord.param.analog=True for an analog filter (frequencies in rad/s). Default False.
cheb1ord.param.fs=Sampling frequency, in the units of wp and ws. Default None (normalised).
cheb1ord.returns=(N, Wn): the order (an int) and the natural frequency (a number, or [low, high]), ready for cheby1(N, ..., Wn).

cheb2ord.desc=Lowest Chebyshev type II order that meets a specification, and its natural frequency. Same as scipy.signal.cheb2ord.
cheb2ord.param.wp=Passband edge: a number for low-pass and high-pass, [low, high] for band filters. Normalised to 0..1 (1 = Nyquist) unless fs is given, then in the units of fs.
cheb2ord.param.ws=Stopband edge, in the same form and units as wp.
cheb2ord.param.gpass=Maximum loss in the passband, in dB.
cheb2ord.param.gstop=Minimum attenuation in the stopband, in dB.
cheb2ord.param.analog=True for an analog filter (frequencies in rad/s). Default False.
cheb2ord.param.fs=Sampling frequency, in the units of wp and ws. Default None (normalised).
cheb2ord.returns=(N, Wn): the order (an int) and the natural frequency (a number, or [low, high]), ready for cheby2(N, ..., Wn).

ellipord.desc=Lowest elliptic order that meets a specification, and its natural frequency. Same as scipy.signal.ellipord.
ellipord.param.wp=Passband edge: a number for low-pass and high-pass, [low, high] for band filters. Normalised to 0..1 (1 = Nyquist) unless fs is given, then in the units of fs.
ellipord.param.ws=Stopband edge, in the same form and units as wp.
ellipord.param.gpass=Maximum loss in the passband, in dB.
ellipord.param.gstop=Minimum attenuation in the stopband, in dB.
ellipord.param.analog=True for an analog filter (frequencies in rad/s). Default False.
ellipord.param.fs=Sampling frequency, in the units of wp and ws. Default None (normalised).
ellipord.returns=(N, Wn): the order (an int) and the natural frequency (a number, or [low, high]), ready for ellip(N, ..., Wn).

lfilter.desc=Filter a signal with b/a coefficients (causal: the output lags the input). Same as scipy.signal.lfilter.
lfilter.param.b=Numerator coefficients.
lfilter.param.a=Denominator coefficients (a number or a list). a[0] must not be 0.
lfilter.param.x=The signal, a list of numbers, evenly sampled. None, NaN and infinity are not allowed.
lfilter.param.axis=-1 (default) or 0. Signals are 1-D, so both mean the same.
lfilter.param.zi=Initial conditions, max(len(a), len(b)) - 1 numbers. Default None (start from rest).
lfilter.returns=The filtered signal, a list of floats; with zi, a tuple (y, zf) with the final conditions.

lfilter_zi.desc=Initial conditions for lfilter that start it in steady state for a step input. Same as scipy.signal.lfilter_zi.
lfilter_zi.param.b=Numerator coefficients.
lfilter_zi.param.a=Denominator coefficients (a number or a list). a[0] must not be 0.
lfilter_zi.returns=A list of max(len(a), len(b)) - 1 floats. Multiply by the first sample to start on a signal.

sosfilt.desc=Filter a signal with second-order sections (causal; accurate at any order). Same as scipy.signal.sosfilt.
sosfilt.param.sos=Second-order sections, rows of [b0, b1, b2, 1, a1, a2], as butter(..., output='sos') returns.
sosfilt.param.x=The signal, a list of numbers, evenly sampled. None, NaN and infinity are not allowed.
sosfilt.param.axis=-1 (default) or 0. Signals are 1-D, so both mean the same.
sosfilt.param.zi=Initial conditions, one [z0, z1] row per section. Default None (start from rest).
sosfilt.returns=The filtered signal, a list of floats; with zi, a tuple (y, zf) with the final conditions.

sosfilt_zi.desc=Initial conditions for sosfilt that start it in steady state for a step input. Same as scipy.signal.sosfilt_zi.
sosfilt_zi.param.sos=Second-order sections, rows of [b0, b1, b2, 1, a1, a2], as butter(..., output='sos') returns.
sosfilt_zi.returns=One [z0, z1] row per section. Multiply by the first sample to start on a signal.

filtfilt.desc=Filter forwards and backwards for zero lag (zero phase), with b/a coefficients. Same as scipy.signal.filtfilt.
filtfilt.param.b=Numerator coefficients.
filtfilt.param.a=Denominator coefficients (a number or a list). a[0] must not be 0.
filtfilt.param.x=The signal, a list of numbers, evenly sampled. None, NaN and infinity are not allowed.
filtfilt.param.axis=-1 (default) or 0. Signals are 1-D, so both mean the same.
filtfilt.param.padtype=Edge extension before filtering: 'odd' (default), 'even', 'constant' or None.
filtfilt.param.padlen=Samples to extend at each end. Default: 3 times the number of filter taps. Must be less than len(x).
filtfilt.param.method='pad' (default). 'gust' is not supported.
filtfilt.param.irlen=Only used by method='gust'; accepted for compatibility.
filtfilt.returns=The filtered signal, a list of floats, in step with the input.

sosfiltfilt.desc=Filter forwards and backwards for zero lag (zero phase), with second-order sections. The way to clean historian data without delay. Same as scipy.signal.sosfiltfilt.
sosfiltfilt.param.sos=Second-order sections, rows of [b0, b1, b2, 1, a1, a2], as butter(..., output='sos') returns.
sosfiltfilt.param.x=The signal, a list of numbers, evenly sampled. None, NaN and infinity are not allowed.
sosfiltfilt.param.axis=-1 (default) or 0. Signals are 1-D, so both mean the same.
sosfiltfilt.param.padtype=Edge extension before filtering: 'odd' (default), 'even', 'constant' or None.
sosfiltfilt.param.padlen=Samples to extend at each end. Default: 3 times the number of filter taps. Must be less than len(x).
sosfiltfilt.returns=The filtered signal, a list of floats, in step with the input.

savgol_coeffs.desc=Savitzky-Golay filter coefficients. Same as scipy.signal.savgol_coeffs, but computed exactly, so they stay correct at high orders where scipy's lose accuracy.
savgol_coeffs.param.window_length=Number of samples in the fitting window (an integer).
savgol_coeffs.param.polyorder=Degree of the fitted polynomial; less than window_length.
savgol_coeffs.param.deriv=Derivative to compute: 0 (default) smooths, 1 gives the slope, 2 the curvature.
savgol_coeffs.param.delta=Sample spacing, used to scale derivatives. Default 1.0.
savgol_coeffs.param.pos=Window position the coefficients evaluate at. Default: the centre.
savgol_coeffs.param.use='conv' (default) for convolution order, 'dot' for dot-product order.
savgol_coeffs.returns=The coefficients, a list of window_length floats.

savgol_filter.desc=Smooth a signal (or take its derivative) by local polynomial fits, keeping peak shapes. Same as scipy.signal.savgol_filter, with exactly computed fits.
savgol_filter.param.x=The signal, a list of numbers, evenly sampled. None, NaN and infinity are not allowed.
savgol_filter.param.window_length=Number of samples in the fitting window (an integer).
savgol_filter.param.polyorder=Degree of the fitted polynomial; less than window_length.
savgol_filter.param.deriv=Derivative to compute: 0 (default) smooths, 1 gives the slope, 2 the curvature.
savgol_filter.param.delta=Sample spacing, used to scale derivatives. Default 1.0.
savgol_filter.param.axis=-1 (default) or 0. Signals are 1-D, so both mean the same.
savgol_filter.param.mode=Edge handling: 'interp' (default, fits the edges), 'mirror', 'constant', 'nearest' or 'wrap'.
savgol_filter.param.cval=Value beyond the edges for mode='constant'. Default 0.0.
savgol_filter.returns=The smoothed signal (or derivative), a list of floats.

medfilt.desc=Median filter: replaces each sample with the median of its window. Removes spikes and keeps steps sharp. Same as scipy.signal.medfilt.
medfilt.param.volume=The signal, a list of numbers. Integers in give integers out.
medfilt.param.kernel_size=Window length, an odd integer. Default 3. The signal is padded with zeros beyond its ends.
medfilt.returns=The filtered signal: integers if the input was all integers, otherwise floats.

find_peaks.desc=Find peaks (local maxima) in a signal, filtered by height, threshold, distance, prominence, width or plateau size. Same as scipy.signal.find_peaks.
find_peaks.param.x=The signal, a list of numbers. None, NaN and infinity are not allowed.
find_peaks.param.height=Required peak height: a number (minimum) or (min, max); either may be None.
find_peaks.param.threshold=Required rise over both neighbouring samples: a number (minimum) or (min, max).
find_peaks.param.distance=Minimum samples between peaks (>= 1). Lower peaks within it are removed first.
find_peaks.param.prominence=Required prominence (how far a peak stands out): a number (minimum) or (min, max).
find_peaks.param.width=Required width in samples, measured at rel_height: a number (minimum) or (min, max).
find_peaks.param.wlen=Window in samples for prominence searches. Default None: the whole signal.
find_peaks.param.rel_height=Height for widths, as a fraction of prominence below the peak. Default 0.5 (half prominence).
find_peaks.param.plateau_size=Required flat-top length in samples: a number (minimum) or (min, max).
find_peaks.returns=A tuple (peaks, properties): peaks is a list of sample indices; properties is a dict of lists, e.g. 'prominences', 'widths', 'peak_heights', for the conditions given.

peak_prominences.desc=How far each peak stands out from the signal around it. Same as scipy.signal.peak_prominences.
peak_prominences.param.x=The signal, a list of numbers. None, NaN and infinity are not allowed.
peak_prominences.param.peaks=Indices of peaks in x, a list of integers (as find_peaks returns).
peak_prominences.param.wlen=Window in samples for prominence searches. Default None: the whole signal.
peak_prominences.returns=A tuple (prominences, left_bases, right_bases).

peak_widths.desc=Width of each peak at a height relative to its prominence. Same as scipy.signal.peak_widths.
peak_widths.param.x=The signal, a list of numbers. None, NaN and infinity are not allowed.
peak_widths.param.peaks=Indices of peaks in x, a list of integers (as find_peaks returns).
peak_widths.param.rel_height=Height for widths, as a fraction of prominence below the peak. Default 0.5 (half prominence).
peak_widths.param.prominence_data=Optional (prominences, left_bases, right_bases), as peak_prominences returns.
peak_widths.param.wlen=Window in samples for prominence searches. Default None: the whole signal.
peak_widths.returns=A tuple (widths, width_heights, left_ips, right_ips); ips are interpolated sample positions.

welch.desc=Power spectral density by Welch's method (averaged, windowed segments). Same as scipy.signal.welch.
welch.param.x=The signal, a list of numbers, evenly sampled. None, NaN and infinity are not allowed.
welch.param.fs=Sampling frequency (samples per second). Default 1.0. Frequencies come out in the same unit.
welch.param.window=Window name (e.g. 'hann'), (name, parameter) tuple, or a list of window values.
welch.param.nperseg=Samples per segment. Default 256 (or the signal length if shorter).
welch.param.noverlap=Samples shared by neighbouring segments. Default: half a segment (welch), an eighth (spectrogram).
welch.param.nfft=FFT length, at least nperseg (zero-padded). Default nperseg.
welch.param.detrend=Detrending of each segment: 'constant' (default), 'linear' or False.
welch.param.return_onesided=True (default): frequencies 0 to fs/2 only, as for real signals.
welch.param.scaling='density' (default, power per Hz) or 'spectrum' (power, e.g. V**2).
welch.param.axis=-1 (default) or 0. Signals are 1-D, so both mean the same.
welch.param.average='mean' (default) or 'median' (robust to bursts) over segments.
welch.returns=A tuple (f, Pxx): frequencies and power spectral density, lists of floats.

periodogram.desc=Power spectral density of the whole signal in one segment. Same as scipy.signal.periodogram.
periodogram.param.x=The signal, a list of numbers, evenly sampled. None, NaN and infinity are not allowed.
periodogram.param.fs=Sampling frequency (samples per second). Default 1.0. Frequencies come out in the same unit.
periodogram.param.window=Window name (e.g. 'hann'), (name, parameter) tuple, or a list of window values.
periodogram.param.nfft=FFT length, at least nperseg (zero-padded). Default nperseg.
periodogram.param.detrend=Detrending of each segment: 'constant' (default), 'linear' or False.
periodogram.param.return_onesided=True (default): frequencies 0 to fs/2 only, as for real signals.
periodogram.param.scaling='density' (default, power per Hz) or 'spectrum' (power, e.g. V**2).
periodogram.param.axis=-1 (default) or 0. Signals are 1-D, so both mean the same.
periodogram.returns=A tuple (f, Pxx): frequencies and power spectral density, lists of floats.

spectrogram.desc=Spectrum over time: one spectrum per segment. Same as scipy.signal.spectrogram.
spectrogram.param.x=The signal, a list of numbers, evenly sampled. None, NaN and infinity are not allowed.
spectrogram.param.fs=Sampling frequency (samples per second). Default 1.0. Frequencies come out in the same unit.
spectrogram.param.window=Window name (e.g. 'hann'), (name, parameter) tuple, or a list of window values.
spectrogram.param.nperseg=Samples per segment. Default 256 (or the signal length if shorter).
spectrogram.param.noverlap=Samples shared by neighbouring segments. Default: half a segment (welch), an eighth (spectrogram).
spectrogram.param.nfft=FFT length, at least nperseg (zero-padded). Default nperseg.
spectrogram.param.detrend=Detrending of each segment: 'constant' (default), 'linear' or False.
spectrogram.param.return_onesided=True (default): frequencies 0 to fs/2 only, as for real signals.
spectrogram.param.scaling='density' (default, power per Hz) or 'spectrum' (power, e.g. V**2).
spectrogram.param.axis=-1 (default) or 0. Signals are 1-D, so both mean the same.
spectrogram.param.mode='psd' (default), 'complex', 'magnitude', 'angle' or 'phase'.
spectrogram.returns=A tuple (f, t, Sxx): frequencies, segment centre times, and Sxx with one row per frequency and one column per time (complex numbers for mode='complex').

hilbert.desc=Analytic signal by the Hilbert transform; abs() of it is the envelope. Same as scipy.signal.hilbert.
hilbert.param.x=The signal, a list of numbers, evenly sampled. None, NaN and infinity are not allowed.
hilbert.param.N=FFT length. Default: len(x); the signal is truncated or zero-padded.
hilbert.param.axis=-1 (default) or 0. Signals are 1-D, so both mean the same.
hilbert.returns=The analytic signal, a list of complex numbers.

resample.desc=Resample to num samples with the FFT (assumes the signal is periodic). Same as scipy.signal.resample.
resample.param.x=The signal, a list of numbers, evenly sampled. None, NaN and infinity are not allowed.
resample.param.num=Number of samples in the result.
resample.param.t=Optional sample times (only the first two are used); then the new times are returned too.
resample.param.axis=Signals are 1-D, so the axis has no effect.
resample.param.window=resample: spectral window (name, (name, parameter) or values). resample_poly: FIR window (default ('kaiser', 5.0)) or the filter's taps as a list.
resample.param.domain='time' (default): x is a signal. 'freq': x is a spectrum (FFT order).
resample.returns=The resampled signal, a list of floats (complex numbers for domain='freq'); with t, a tuple (signal, new_times).

resample_poly.desc=Resample by up / down with a polyphase FIR filter (good for non-periodic signals). Same as scipy.signal.resample_poly.
resample_poly.param.x=The signal, a list of numbers, evenly sampled. None, NaN and infinity are not allowed.
resample_poly.param.up=Upsampling factor (a whole number >= 1).
resample_poly.param.down=Downsampling factor (a whole number >= 1).
resample_poly.param.axis=Signals are 1-D, so the axis has no effect.
resample_poly.param.window=resample: spectral window (name, (name, parameter) or values). resample_poly: FIR window (default ('kaiser', 5.0)) or the filter's taps as a list.
resample_poly.param.padtype=Edge handling: 'constant' (default), 'edge', 'symmetric', 'reflect', 'wrap', 'smooth', 'line', 'antisymmetric', 'antireflect', or 'mean', 'median', 'minimum', 'maximum' (subtract it, resample, add it back).
resample_poly.param.cval=Value beyond the edges for padtype='constant'. Default 0.
resample_poly.returns=The resampled signal, ceil(len(x) * up / down) floats.

decimate.desc=Lowpass filter, then keep every q-th sample (no aliasing). Same as scipy.signal.decimate.
decimate.param.x=The signal, a list of numbers, evenly sampled. None, NaN and infinity are not allowed.
decimate.param.q=Downsampling factor (a whole number).
decimate.param.n=Filter order. Default 8 for 'iir', 20 * q for 'fir'.
decimate.param.ftype='iir' (default, Chebyshev type I) or 'fir' (Hamming-windowed).
decimate.param.axis=Signals are 1-D, so the axis has no effect.
decimate.param.zero_phase=True (default): filter forwards and backwards, so there is no lag.
decimate.returns=The decimated signal, ceil(len(x) / q) floats.
